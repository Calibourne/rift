<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="512"
     height="512"
     viewBox="0 0 512 512">

  <defs>

    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#171412"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>

    <linearGradient id="outerSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C7960"/>
      <stop offset="20%" stop-color="#4A4035"/>
      <stop offset="50%" stop-color="#A38B6B"/>
      <stop offset="80%" stop-color="#2C241D"/>
      <stop offset="100%" stop-color="#6F5C48"/>
    </linearGradient>

    <linearGradient id="innerSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D1B48A"/>
      <stop offset="100%" stop-color="#5B4B39"/>
    </linearGradient>

    <linearGradient id="cyanCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3FFFFF"/>
      <stop offset="100%" stop-color="#00A6D6"/>
    </linearGradient>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="12"
                    flood-color="#000000"
                    flood-opacity="0.8"/>
    </filter>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Outer dieselpunk containment ring -->
  <g filter="url(#shadow)">

    <circle cx="256" cy="256"
            r="180"
            fill="none"
            stroke="url(#outerSteel)"
            stroke-width="42"/>

    <!-- Segmented armor plates -->
    <g fill="#241E18"
       stroke="#7A674F"
       stroke-width="3">

      <path d="M180 52 L332 52 L320 84 L192 84 Z"/>
      <path d="M180 428 L332 428 L320 460 L192 460 Z"/>

      <path d="M52 180 L84 192 L84 320 L52 332 Z"/>
      <path d="M428 180 L460 192 L460 320 L428 332 Z"/>

      <path d="M104 108 L142 96 L180 140 L160 160 Z"/>
      <path d="M352 372 L408 404 L372 352 L344 344 Z"/>

      <path d="M352 140 L372 160 L408 108 L344 144 Z"/>
      <path d="M104 404 L160 352 L180 372 L142 416 Z"/>

    </g>

    <!-- Rivets -->
    <g fill="#16120F"
       stroke="#B79A73"
       stroke-width="2.5">

      <circle cx="256" cy="70" r="7"/>
      <circle cx="256" cy="442" r="7"/>

      <circle cx="70" cy="256" r="7"/>
      <circle cx="442" cy="256" r="7"/>

      <circle cx="128" cy="128" r="6"/>
      <circle cx="384" cy="128" r="6"/>

      <circle cx="128" cy="384" r="6"/>
      <circle cx="384" cy="384" r="6"/>

    </g>

    <!-- Amber status lights -->
    <g filter="url(#glow)">
      <rect x="246" y="58" width="20" height="8" rx="4" fill="#FFB347"/>
      <rect x="246" y="446" width="20" height="8" rx="4" fill="#FFB347"/>

      <rect x="58" y="246" width="8" height="20" rx="4" fill="#FFB347"/>
      <rect x="446" y="246" width="8" height="20" rx="4" fill="#FFB347"/>
    </g>

  </g>

  <!-- Inner core plate -->
  <circle cx="256"
          cy="256"
          r="124"
          fill="#120F0D"
          stroke="#4C4032"
          stroke-width="4"/>

  <!-- Cyan breach glow -->
  <path d="M178 128 L350 256 L178 384"
        stroke="url(#cyanCore)"
        stroke-width="56"
        stroke-linejoin="bevel"
        fill="none"
        opacity="0.9"
        filter="url(#glow)"/>

  <!-- Metallic rift edge -->
  <path d="M185 140 L330 256 L185 372"
        stroke="url(#innerSteel)"
        stroke-width="22"
        stroke-linejoin="bevel"
        fill="none"/>

  <!-- Internal circuitry -->
  <g stroke="#7CF7FF"
     stroke-width="2"
     opacity="0.45">

    <path d="M228 208 H278 V228 H320"/>
    <path d="M214 254 H270 V276 H318"/>
    <path d="M224 308 H292 V328 H336"/>

    <circle cx="278" cy="228" r="3" fill="#7CF7FF"/>
    <circle cx="270" cy="276" r="3" fill="#7CF7FF"/>
    <circle cx="292" cy="328" r="3" fill="#7CF7FF"/>

  </g>

  <!-- Vent details -->
  <g fill="#2B241D">
    <rect x="226" y="102" width="60" height="8" rx="4"/>
    <rect x="226" y="116" width="60" height="8" rx="4"/>

    <rect x="226" y="388" width="60" height="8" rx="4"/>
    <rect x="226" y="402" width="60" height="8" rx="4"/>
  </g>

</svg>