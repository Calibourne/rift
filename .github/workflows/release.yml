name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            bundle: deb
          - os: ubuntu-latest
            bundle: appimage
          - os: windows-latest
            bundle: msi
          - os: windows-latest
            bundle: nsis

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install npm deps
        run: npm ci

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0.6.2
        with:
          args: --bundles ${{ matrix.bundle }}

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}-${{ matrix.bundle }}
          path: src-tauri/target/release/bundle/${{ matrix.bundle }}/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles

      - name: Create draft release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Rift ${{ github.ref_name }}" \
            --draft \
            --notes "" \
            bundles/*/* 2>/dev/null || \
          gh release upload "${{ github.ref_name }}" \
            bundles/*/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}